[package]
name = "cadcraft-server"
description = "CADCraft session server: hosts shared drawing sessions over WebSockets for the desktop and web apps"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "cadcraft_server"
path = "src/lib.rs"

[[bin]]
name = "cadcraft-server"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
cadcraft-collab = { workspace = true }
cadcraft-doc = { workspace = true }
cadcraft-io = { workspace = true }
clap = { workspace = true }
getrandom = "0.3"
serde_json = { workspace = true }
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }

[dev-dependencies]
cadcraft-engine = { workspace = true }
cadcraft-ai = { workspace = true }
